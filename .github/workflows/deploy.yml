# Every push to main: check, build, and publish the static site to Firebase Hosting
# (Google Cloud project zorvex-space-apps, free; zorvex.earth points at it through DNS at Porkbun).
# The deploy uses a service account that may only manage Hosting (secret FIREBASE_SERVICE_ACCOUNT).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:facts
      - run: npm run build
        env:
          VITE_ASK_URL: ${{ vars.ASK_URL }}
      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0 (pinned: it receives the deploy key)
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: zorvex-space-apps
          channelId: live
